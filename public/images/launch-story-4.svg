  <rect x="210" y="1020" width="660" height="104" rx="18" fill="#7ACFA8" fill-opacity="0.12" stroke="#7ACFA8" stroke-width="2.5" stroke-dasharray="10 7" />
  <text x="540" y="1090" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="3" fill="#7ACFA8">CRAFTFRIENDS</text>

  <text x="540" y="1200" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="42" font-weight="800" fill="#F5EDE3">−30% на любой тариф</text>

  <!-- Робот -->
  <svg x="360" y="1360" width="360" height="282" viewBox="-32 -68 102 80">
    <line x1="0" y1="-46" x2="0" y2="-58" stroke="#F5EDE3" stroke-width="2.5" />
    <circle cx="0" cy="-61" r="4" fill="#E8C070" />
    <rect x="-28" y="-46" width="56" height="38" rx="10" fill="#D48766" />
    <rect x="-20" y="-40" width="40" height="18" rx="6" fill="#141212" />
    <circle cx="-8" cy="-31" r="3.5" fill="#F5EDE3" />
    <circle cx="8" cy="-31" r="3.5" fill="#F5EDE3" />
    <path d="M28,-34 L46,-26" stroke="#D48766" stroke-width="5" stroke-linecap="round" />
    <rect x="42" y="-26" width="22" height="14" rx="7" fill="#7ACFA8" />
    <circle cx="-14" cy="0" r="10" fill="#F5EDE3" />
    <line x1="-14" y1="-6" x2="-14" y2="6" stroke="#141212" stroke-width="2.5" />
    <circle cx="14" cy="0" r="10" fill="#F5EDE3" />
    <line x1="14" y1="-6" x2="14" y2="6" stroke="#141212" stroke-width="2.5" />
  </svg>

  <!-- Футер -->
  <text x="540" y="1770" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="700" fill="#E8C070">Старт сентябрьского потока — 1 сентября</text>
  <text x="540" y="1818" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="500" fill="#8A8078">Промокод действует на любой платный тариф</text>
