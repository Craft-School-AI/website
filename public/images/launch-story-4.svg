  <rect x="32" y="32" width="1016" height="1856" rx="40" fill="none" stroke="#3A3532" stroke-width="2" />

  <!-- Логотип -->
  <svg x="90" y="118" width="60" height="82" viewBox="80 50 220 300">
    <path d="M 260 140 C 260 100, 220 80, 190 80 C 140 80, 110 120, 110 170 L 110 230 C 110 280, 140 320, 190 320 C 220 320, 260 300, 260 260"
