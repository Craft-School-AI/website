    <path d="M 180 140 L 210 160 L 180 180" fill="none" stroke="#E8C070" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 220 220 L 190 240 L 220 260" fill="none" stroke="#E8C070" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="120" cy="140" r="8" fill="#E8C070" opacity="0.8" />
    <circle cx="260" cy="260" r="8" fill="#E8C070" opacity="0.8" />
  </svg>
  <text x="164" y="176" font-family="Manrope, Arial, sans-serif" font-size="42" font-weight="800" fill="#F5EDE3">Craft School</text>

  <!-- Плашка -->
  <rect x="90" y="292" width="448" height="58" rx="29" fill="#D48766" fill-opacity="0.14" stroke="#D48766" stroke-opacity="0.5" stroke-width="2" />
  <text x="118" y="330" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#D48766">РЕГИСТРАЦИЯ ЗАКРЫТА</text>

  <!-- Заголовок -->
  <text x="84" y="500" font-family="Manrope, Arial, sans-serif" font-size="132" font-weight="800" fill="#D48766">Спасибо!</text>

  <!-- Подзаголовок -->
  <text x="90" y="588" font-family="Manrope, Arial, sans-serif" font-size="38" font-weight="700" fill="#F5EDE3">Набор на бесплатный августовский</text>
  <text x="90" y="640" font-family="Manrope, Arial, sans-serif" font-size="38" font-weight="700" fill="#F5EDE3">поток закрыт</text>

  <!-- Пояснение -->
  <text x="90" y="726" font-family="Manrope, Arial, sans-serif" font-size="33" font-weight="500" fill="#C4B8AA">Вас оказалось гораздо больше, чем я</text>
  <text x="90" y="770" font-family="Manrope, Arial, sans-serif" font-size="33" font-weight="500" fill="#C4B8AA">ожидал. Кто успел — учится бесплатно.</text>

  <!-- Промо-карточка -->
  <rect x="88" y="850" width="904" height="416" rx="24" fill="#1E1B1A" stroke="#7ACFA8" stroke-opacity="0.45" stroke-width="2" />
  <text x="540" y="922" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2" fill="#E8C070">ХОТИТЕ УЧИТЬСЯ В СЕНТЯБРЕ?</text>
  <text x="540" y="982" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="500" fill="#C4B8AA">Ваш промокод на обучение:</text>

