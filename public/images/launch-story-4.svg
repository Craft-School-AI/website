      <stop offset="0%" stop-color="#D48766" />
      <stop offset="100%" stop-color="#E8C070" />
    </linearGradient>
    <radialGradient id="glow-t4" cx="18%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#D48766" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#D48766" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-g4" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#7ACFA8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#7ACFA8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="#141212" />
