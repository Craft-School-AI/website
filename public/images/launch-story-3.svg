<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-main-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D48766" />
      <stop offset="100%" stop-color="#E8C070" />
    </linearGradient>
    <radialGradient id="glow-g3" cx="50%" cy="16%" r="60%">
      <stop offset="0%" stop-color="#7ACFA8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7ACFA8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-t3" cx="88%" cy="92%" r="55%">
      <stop offset="0%" stop-color="#D48766" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#D48766" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="#141212" />
  <rect width="1080" height="1920" fill="url(#glow-g3)" />
  <rect width="1080" height="1920" fill="url(#glow-t3)" />
  <rect x="32" y="32" width="1016" height="1856" rx="40" fill="none" stroke="#3A3532" stroke-width="2" />

  <!-- Логотип -->
  <svg x="90" y="118" width="60" height="82" viewBox="80 50 220 300">
    <path d="M 260 140 C 260 100, 220 80, 190 80 C 140 80, 110 120, 110 170 L 110 230 C 110 280, 140 320, 190 320 C 220 320, 260 300, 260 260"
      fill="none" stroke="url(#logo-main-gradient)" stroke-width="24" stroke-linecap="round" />
    <path d="M 180 140 L 210 160 L 180 180" fill="none" stroke="#E8C070" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 220 220 L 190 240 L 220 260" fill="none" stroke="#E8C070" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="120" cy="140" r="8" fill="#E8C070" opacity="0.8" />
    <circle cx="260" cy="260" r="8" fill="#E8C070" opacity="0.8" />
  </svg>
  <text x="164" y="176" font-family="Manrope, Arial, sans-serif" font-size="42" font-weight="800" fill="#F5EDE3">Craft School</text>

  <!-- Плашка -->
  <rect x="90" y="300" width="330" height="58" rx="29" fill="#7ACFA8" fill-opacity="0.14" stroke="#7ACFA8" stroke-opacity="0.5" stroke-width="2" />
  <text x="118" y="338" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#7ACFA8">КОМУ ПОДОЙДЁТ</text>

  <!-- Заголовок -->
  <text x="86" y="470" font-family="Manrope, Arial, sans-serif" font-size="104" font-weight="800" fill="#F5EDE3">Подойдёт</text>
  <text x="86" y="590" font-family="Manrope, Arial, sans-serif" font-size="104" font-weight="800" fill="#D48766">каждому</text>

  <!-- Подзаголовок -->
  <text x="90" y="668" font-family="Manrope, Arial, sans-serif" font-size="37" font-weight="500" fill="#C4B8AA">Без IT-образования и опыта в коде</text>

  <!-- Чеклист -->
  <g font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="600" fill="#F5EDE3">
    <g transform="translate(118,800)"><circle r="22" fill="#7ACFA8" /><path d="M-9 0 L-3 7 L10 -8" fill="none" stroke="#141212" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></g>
    <text x="160" y="811">Есть своё дело — или только идея</text>
    <g transform="translate(118,892)"><circle r="22" fill="#7ACFA8" /><path d="M-9 0 L-3 7 L10 -8" fill="none" stroke="#141212" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></g>
    <text x="160" y="903">Любая профессия, не из IT</text>
    <g transform="translate(118,984)"><circle r="22" fill="#7ACFA8" /><path d="M-9 0 L-3 7 L10 -8" fill="none" stroke="#141212" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></g>
    <text x="160" y="995">Никогда не писали код — не страшно</text>
    <g transform="translate(118,1076)"><circle r="22" fill="#7ACFA8" /><path d="M-9 0 L-3 7 L10 -8" fill="none" stroke="#141212" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></g>
    <text x="160" y="1087">Готовы уделять пару вечеров в неделю</text>
  </g>

  <!-- Главное: идея и желание -->
  <rect x="88" y="1170" width="904" height="210" rx="24" fill="#1E1B1A" stroke="#7ACFA8" stroke-opacity="0.4" stroke-width="2" />
  <text x="540" y="1240" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#E8C070">ГЛАВНОЕ — ЭТО</text>
  <text x="540" y="1312" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="52" font-weight="800" fill="#F5EDE3">Идея и желание</text>
  <text x="540" y="1360" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="600" fill="#C4B8AA">учиться — остальному научим</text>

  <!-- Робот -->
  <svg x="360" y="1440" width="360" height="282" viewBox="-32 -68 102 80">
    <line x1="0" y1="-46" x2="0" y2="-58" stroke="#F5EDE3" stroke-width="2.5" />
    <circle cx="0" cy="-61" r="4" fill="#E8C070" />
    <rect x="-28" y="-46" width="56" height="38" rx="10" fill="#D48766" />
    <rect x="-20" y="-40" width="40" height="18" rx="6" fill="#141212" />
    <circle cx="-8" cy="-31" r="3.5" fill="#F5EDE3" />
    <circle cx="8" cy="-31" r="3.5" fill="#F5EDE3" />
    <path d="M28,-34 L46,-26" stroke="#D48766" stroke-width="5" stroke-linecap="round" />
    <rect x="42" y="-26" width="22" height="14" rx="7" fill="#7ACFA8" />
    <circle cx="-14" cy="0" r="10" fill="#F5EDE3" />
    <line x1="-14" y1="-6" x2="-14" y2="6" stroke="#141212" stroke-width="2.5" />
    <circle cx="14" cy="0" r="10" fill="#F5EDE3" />
    <line x1="14" y1="-6" x2="14" y2="6" stroke="#141212" stroke-width="2.5" />
  </svg>

  <!-- Футер -->
  <text x="540" y="1800" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="32" font-weight="700" fill="#E8C070">craft-school.ru/schedule</text>
  <text x="540" y="1846" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="500" fill="#8A8078">Приходите учиться — с нуля и без страха</text>
</svg>
